server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The app is one self-contained file: no third-party origins, no network calls.
    # 'unsafe-inline' is required because the styles, script and logo all live inline.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Do not advertise the exact server version.
    server_tokens off;

    # Compress text assets on the fly. The inline WebP logo is already compressed.
    gzip              on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/html application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # Never cache the app shell, so an updated image lands immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Lightweight endpoint for container health checks and uptime probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should ever be writable or executable over HTTP.
    location ~ /\. {
        deny all;
    }
}
